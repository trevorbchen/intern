# Research-internship scraper config
keywords:        # a posting must match at least one of these ...
  - research intern
  - research internship
  - research assistant
  - summer research
  - REU
  - research scientist intern
  - machine learning research
exclude:         # ... and none of these
  - senior
  - staff
  - principal
  - director
  - unpaid
locations: []    # empty = any; e.g. ["Remote", "Boston", "United States"]

sources:
  greenhouse:    # board tokens: boards.greenhouse.io/<token>
    - anthropic
  lever:         # jobs.lever.co/<company>
    - palantir
  rss: []        # any RSS/Atom feed URLs of job postings
  linkedin:
    enabled: true
    searches: ["research intern", "machine learning research intern", "research internship"]
    location: "United States"
    pages: 2
    delay_seconds: 3
  twitter:       # headless-browser crawl of x.com; set X_AUTH_TOKEN + X_CT0 (your own session cookies)
    enabled: true
    queries:
      - '("research intern" OR "research internship" OR "REU") (hiring OR apply OR "now open") -is:retweet lang:en'
    scrolls: 3

interval_minutes: 30   # used by --watch
db_path: internbot.db
export_csv: out/new_internships.csv
# Optional: Slack/Discord-compatible webhook, or set INTERNBOT_WEBHOOK
webhook_url: ""
